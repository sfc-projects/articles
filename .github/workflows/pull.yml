name: Pull Request
on:
  pull_request:
    branches:
      - main
jobs:
  release:
    name: Pull Request
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - run: |
          npm ci
          npm run convert
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: articles
          path: ./articles.pdf
