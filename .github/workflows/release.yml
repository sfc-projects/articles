name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'articles.md'
permissions:
  contents: write
jobs:
  release:
    name: Release
    runs-on: macos-latest
    steps:
      - name: Set release metadata
        id: release
        run: |
          echo "date=$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"
          echo "tag=$(uuidgen)" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - run: |
          npm ci
          npm run convert
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ steps.release.outputs.date }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cp ./articles.pdf "./articles_${RELEASE_DATE}.pdf"
          gh release create "$RELEASE_TAG" \
            "./articles_${RELEASE_DATE}.pdf" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_DATE" \
            --notes "Compiled PDF $GITHUB_REPOSITORY"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: articles
          path: ./articles.pdf
          if-no-files-found: error
